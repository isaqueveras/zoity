global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

rule_files:

scrape_configs:
  - job_name: zoity
    scrape_interval: 10s
    static_configs:
      - targets: ["zoity_app:8080"]

  - job_name: pushgateway
    scrape_interval: 10s
    static_configs:
      - targets: ["pushgateway:9091"]